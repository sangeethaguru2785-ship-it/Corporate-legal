<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signed Out — Stackly</title>
  <meta name="description" content="You have been signed out of the Stackly client or admin portal." />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" />
</head>
<body>

  <!-- Logout Content -->
  <section class="section-padding bg-navy-800 text-center" style="min-height:100vh;display:flex;align-items:center;">
    <div class="container">
      <div class="mb-4" data-aos="fade-up">
        <img src="assets/img/logo.webp" alt="Stackly" style="height:clamp(56px, 10vw, 76px);width:auto;display:block;margin:0 auto;filter:brightness(0) saturate(100%) invert(58%) sepia(28%) saturate(380%) hue-rotate(-5deg);" />
      </div>
      <div data-aos="fade-up">
        <div style="width:92px;height:92px;margin:0 auto 1.5rem;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(171,135,82,0.15);border:2px solid var(--gold);color:var(--gold);font-size:2.2rem;">
          <i class="fa-solid fa-check"></i>
        </div>
      </div>
      <h1 class="section-title mt-3" style="color:var(--white);">You&rsquo;ve Been Signed Out</h1>
      <p class="section-subtitle mx-auto mt-3" style="color:rgba(255,255,255,0.65);max-width:560px;" data-aos="fade-up">Your session has ended securely. Please sign back in to continue managing your matters, appointments, and documents.</p>
      <div class="d-flex flex-wrap justify-content-center gap-3 mt-4" data-aos="fade-up">
        <a href="login.html?role=admin" class="btn btn-gold btn-lg"><i class="fa-solid fa-user-tie me-2"></i>Admin Sign In</a>
        <a href="login.html?role=user" class="btn btn-outline-light btn-lg"><i class="fa-regular fa-user me-2"></i>Client Sign In</a>
        <a href="index.html" class="btn btn-outline-light btn-lg"><i class="fa-solid fa-house me-2"></i>Back to Website</a>
      </div>
      <div class="mt-5" data-aos="fade-up">
        <p style="font-size:0.82rem;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:1rem;">Continue Exploring</p>
        <div class="d-flex flex-wrap justify-content-center gap-2">
          <a href="practice-areas.html" class="badge-gold" style="padding:0.6rem 1.2rem;">Practice Areas</a>
          <a href="team.html" class="badge-gold" style="padding:0.6rem 1.2rem;">Our Team</a>
          <a href="insights.html" class="badge-gold" style="padding:0.6rem 1.2rem;">Insights</a>
          <a href="contact.html" class="badge-gold" style="padding:0.6rem 1.2rem;">Contact</a>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/split-type@0.3.4"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>try { window.stacklyAuth.clearSession(); } catch (e) {}</script>
</body>
</html>
